# nemar-observability — SCCN Cloudflare account.
# All ops via cfman: npx cfman wrangler --account sccn -c wrangler.toml
name = "nemar-observability"
main = "src/index.ts"
compatibility_date = "2024-12-01"
compatibility_flags = ["nodejs_compat"]

# Mount at dashboard.nemar.org/observability* as a Worker ROUTE layered over the
# `nemar-dashboard` Pages project (Worker routes take precedence per-path, so the
# legacy /citations stays on Pages, untouched). NOT a custom_domain — that
# hostname is already claimed by the Pages project.
routes = [
  # Root-only: serves the dashboard hub at dashboard.nemar.org/ . No wildcard,
  # so it matches ONLY `/` -- /citations stays on the nemar-dashboard Pages project.
  { pattern = "dashboard.nemar.org/", zone_name = "nemar.org" },
  { pattern = "dashboard.nemar.org/observability*", zone_name = "nemar.org" }
]
# workers.dev fallback so the worker is reachable for dev/testing.
workers_dev = true

# Hourly snapshot recompute at :47. nemar-cli's nemar-db-backup workflow exports
# nemar-db every hour (its Actions cron starts at :00 but runs commit between
# :10 and :40), and D1 rejects other queries during an export. :47 stays clear
# of that window; the cron also retries a locked read (src/lib/d1-retry.ts).
[triggers]
crons = ["47 * * * *"]

# Source DB: nemar-cli's D1, READ-ONLY (SELECT only in code). NO migrations_dir —
# nemar-cli owns its schema; this worker must never migrate it.
[[d1_databases]]
binding = "NEMAR_DB"
database_name = "nemar-db"
database_id = "009b1a44-a385-4ecf-812d-ec8341587cb5"

# Own DB: snapshot history + pushed pipeline sections. database_id is filled at
# first deploy (Phase 6): `cfman wrangler --account sccn d1 create nemar-observability-db`.
[[d1_databases]]
binding = "OBS_DB"
database_name = "nemar-observability-db"
database_id = "3bcfb654-63a3-4e5a-9c03-5ce0c3e1bd66"
migrations_dir = "src/db/migrations"

[vars]
ENVIRONMENT = "production"
NEMAR_API_BASE = "https://api.nemar.org"
CF_ACCOUNT_ID = "da8d7a2a8680dab01592bbbc6f67f12c"
CF_ZONE_ID = "e684135de46029c91fd6c93715ace4ce"
AE_DATASET = "nemar_access_metrics"
# Embed loads of the signal viewer on other sites: one point per load, written
# by the website's edge middleware (website ADR 0024). Read with CF_ANALYTICS_TOKEN.
EMBED_AE_DATASET = "nemar_website_embeds"
# The website origin that dataset links on the page point at.
WEBSITE_BASE_URL = "https://nemar.org"
# Range-aware audience source for the self-hosted NEMAR Umami website.
UMAMI_BASE_URL = "https://analytics.nemar.org"
UMAMI_WEBSITE_ID = "b4b5f61c-56b2-4b8c-9023-6a29ed3904ac"
# UMAMI_EVENTS_COVERAGE_START = "YYYY-MM-DD" # set after production instrumentation is verified

# Secrets (npx cfman wrangler --account sccn secret put <NAME> -c wrangler.toml):
# - CF_ANALYTICS_TOKEN       (Bearer w/ Account Analytics Read; reads the AE SQL API)
# - CF_ZONE_ANALYTICS_TOKEN  (Bearer w/ Zone Analytics Read on nemar.org; reads the
#                             GraphQL Analytics API. Account Analytics Read does NOT
#                             cover zone analytics -- these are two distinct scopes.
#                             Install both envs with scripts/put-zone-analytics-secret.sh)
# - OBS_INGEST_TOKENS_JSON   (JSON object mapping section keys to dedicated Bearer tokens)
# - UMAMI_API_KEY            (self-hosted Umami API key; server-side only)

[env.dev]
name = "nemar-observability-dev"
workers_dev = true
routes = []

[[env.dev.d1_databases]]
binding = "NEMAR_DB"
database_name = "nemar-db-dev"
database_id = "017d8f4e-a591-4a3d-944b-01b5ffe5101d"

[[env.dev.d1_databases]]
binding = "OBS_DB"
database_name = "nemar-observability-db-dev"
database_id = "77a5a390-5f4c-49c1-af74-8b7dce81ee10"
migrations_dir = "src/db/migrations"

[env.dev.vars]
ENVIRONMENT = "development"
NEMAR_API_BASE = "https://nemar-api-dev.sccn-org.workers.dev"
CF_ACCOUNT_ID = "da8d7a2a8680dab01592bbbc6f67f12c"
CF_ZONE_ID = "e684135de46029c91fd6c93715ace4ce"
AE_DATASET = "nemar_access_metrics_dev"
# Staging and website previews both write here, so production never sees them.
EMBED_AE_DATASET = "nemar_website_embeds_dev"
WEBSITE_BASE_URL = "https://test.nemar.org"
# Optional dev audience source; keep any API key in a Worker secret:
# UMAMI_BASE_URL = "https://umami.nemar.org"
# UMAMI_WEBSITE_ID = "<website-id>"
# UMAMI_EVENTS_COVERAGE_START = "YYYY-MM-DD" # set after production instrumentation is verified
