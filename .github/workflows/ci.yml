name: CI

on:
  push:
    branches: [main]
  # No branch filter: a stacked PR targets its parent branch, not main, and
  # `branches: [main]` silently gave those PRs no checks at all rather than
  # failing them. Every PR gets checked regardless of what it merges into.
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      - name: Install
        run: bun install --frozen-lockfile

      - name: Lint + format (Biome)
        run: bun run lint

      - name: Typecheck
        run: bun run typecheck

      - name: Test
        run: bun test
